[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-py2rust"
version = "0.1.0"
description = "Agentic Python-to-Rust converter with a verified differential test baseline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "converterproject" }]

dependencies = [
    "langgraph>=0.2.60",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    # Deep-agent translator. `deepagents` builds on LangGraph; `langchain-openai`
    # supplies the DeepSeek-compatible chat model.
    "deepagents>=0.7.34",
    "langchain-openai>=1.7",
]

[project.optional-dependencies]
tracing = ["mlflow>=2.14"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "mlflow>=2.14",
]

[project.scripts]
converter-eval = "converter.evals.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"converter.sandbox" = [
    "rust_harness/Cargo.toml",
    "rust_harness/Cargo.lock",
    "rust_harness/src/*.rs",
]
"converter.errors_map" = ["*.rs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These are converter *inputs*, deliberately written in the pytest subset the
# ingester supports (which does not support `is True` / `is False`).
"src/converter/evals/programs/*_tests.py" = ["E712"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
